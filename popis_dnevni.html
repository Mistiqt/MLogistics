<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellantis | Dnevni Popis</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --header-bg: #090a0c;   /* 1. Sloj (Najtamnije): Header gore */
            --body-bg:   #121418;   /* 2. Sloj (Srednje): Pozadina stranice (body) */
            --panel-bg:  #1a1d24;   /* 3. Sloj (Najsvetlije): Glavni kontejner / kartica */
            
            --panel-2:#21242c;     
            --panel-3:#2a2e38;     
            --border:#333842;
            --border-soft:#252932;
            --text:#eceef1;
            --text-dim:#9a9ea6;
            --brand:#1a3263;
            --brand-2:#2a4a8a;
            --brand-light:#6d9ae0;
            --shadow:0 6px 24px rgba(0,0,0,0.6);
        }

        html { scroll-behavior: smooth; }
        
        /* 2. Sloj: Pozadina stranice (body) */
        body { font-family: 'Inter', sans-serif; background-color: var(--body-bg); color: var(--text); margin: 0; padding: 0; }

        /* 1. Sloj: Najtamniji header gore */
        .main-header { 
            background-color: var(--header-bg); 
            padding: 25px 0; 
            border-bottom: 1px solid var(--border-soft); 
            text-align: center; 
            margin-bottom: 0; 
        }
        .main-header h1 { margin: 0; font-size: 24px; letter-spacing: 3px; color: #fff; text-transform: uppercase; font-weight: 700; }
        .main-header p { margin: 6px 0 0; font-size: 13px; color: var(--text-dim); }

        /* 3. Sloj: Najsvetiji deo (glavni kontejner sa tekstom i popisom) */
        .container { 
            max-width: 1360px; 
            background: var(--panel-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border-soft); 
            margin: 30px auto; 
        }
        
        .controls { display: flex; gap: 15px; margin-bottom: 25px; align-items: flex-end; background: var(--panel-2); padding: 20px; border-radius: 8px; border: 1px solid var(--border-soft); flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 250px; }
        
        label { display: block; font-weight: 700; margin-bottom: 6px; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        
        select, input[type="text"], input[type="date"], input[type="time"] { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; background: var(--panel-bg); color: var(--text); }
        select:focus, input:focus { background: var(--panel-3); border-color: var(--brand-light); outline: none; box-shadow: 0 0 0 3px rgba(109,154,224,0.18); }
        input[type="date"], input[type="time"] { color-scheme: dark; }
        input.nedostaje { border-color: #f08890; box-shadow: 0 0 0 3px rgba(240,136,144,0.2); }

        .btn-refresh-modern { 
            background: var(--panel-bg); border: 1px solid var(--border); cursor: pointer; padding: 10px 16px; font-size: 13px; color: var(--text); border-radius: 6px; display: inline-flex; align-items: center; gap: 8px; font-weight: 600; transition: all 0.2s ease-in-out; height: 41px;
        }
        .btn-refresh-modern:hover { background: var(--panel-3); border-color: var(--brand-light); color: var(--brand-light); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
        th, td { border: 1px solid var(--border-soft); padding: 12px 15px; text-align: left; font-size: 14px; vertical-align: middle; color: var(--text); }
        th { background-color: var(--panel-3); color: var(--brand-light); text-align: center; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        .th-qty { text-align: center; background-color: var(--panel-3); padding: 12px 10px; font-weight: bold; }
        .qty-cell { text-align: center; }
        
        .qty-input { width: 90px; padding: 8px; text-align: center; font-weight: bold; font-size: 16px; border: 2px solid var(--brand-2); border-radius: 6px; display: inline-block; background: var(--panel-bg); color: var(--text); }
        .qty-input:focus { background-color: var(--panel-3); border-color: var(--brand-light); outline: none; box-shadow: 0 0 0 3px rgba(109,154,224,0.18); }

        .btn-container { margin-top: 25px; text-align: right; display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
        
        button.action-btn { background-color: var(--brand); color: white; border: none; padding: 12px 24px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button.action-btn:hover { background-color: var(--brand-2); }
        
        .btn-sync { background-color: #2e9c4e; }
        .btn-sync:hover { background-color: #257d3e; }
        
        .btn-reset { background-color: transparent; color: #f08890; border: 1px solid rgba(240,136,144,0.4); }
        .btn-reset:hover { background: rgba(220,53,69,0.15); color: #f08890; }

        .btn-excel { background-color: var(--panel-3); color: var(--text); border: 1px solid var(--border); }
        .btn-excel:hover { background: var(--border); color: #fff; }

        .center { text-align: center; color: var(--text-dim); }
        #loading { display: none; align-items: center; gap: 8px; color: var(--brand-light); font-weight: 600; font-size: 13px; align-self: center; height: 41px; margin-left: 5px; }

        /* Animacija rotacije pri učitavanju iz Google Sheets */
        .rotator {
            display: inline-block;
            width: 16px; height: 16px;
            border: 3px solid rgba(109,154,224,0.25);
            border-top-color: var(--brand-light);
            border-radius: 50%;
            animation: rotacija 0.8s linear infinite;
            flex-shrink: 0;
        }
        .rotator-big { width: 38px; height: 38px; border-width: 5px; }
        @keyframes rotacija { to { transform: rotate(360deg); } }
        .loading-cell { padding: 35px 15px !important; }
        .loading-cell .rotator { display: block; margin: 0 auto 12px; }
        .btn-refresh-modern.loading svg { animation: rotacija 0.8s linear infinite; }
        
        tr:hover td { background-color: rgba(255, 255, 255, 0.01); }
        .search-results { margin: -10px 0 20px; padding: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; display:none; }
        .search-loading { display:flex; align-items:center; gap:12px; padding:9px 4px; color:var(--brand-light); font-weight:600; }
        .search-loading .rotator { width:20px; height:20px; border-width:3px; }
        .search-loading small { display:block; color:var(--text-dim); font-size:12px; font-weight:400; margin-top:3px; }
        .search-result { padding: 10px; border-bottom: 1px solid var(--border-soft); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
        .search-result:last-child { border-bottom:0; }
        .mini-btn { background:var(--brand); color:white; border:0; padding:8px 12px; border-radius:5px; cursor:pointer; }
        .history-panel { margin-top:25px; padding:18px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; }
        .history-panel table { margin-top:12px; }
    
.save-overlay{position:fixed;inset:0;background:rgba(6,9,15,.78);z-index:9999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.save-overlay.active{display:flex}.save-dialog{background:var(--panel-bg);border:1px solid var(--brand-light);border-radius:12px;padding:32px 45px;text-align:center;box-shadow:0 18px 70px #0009;max-width:90vw}.save-dialog .rotator{display:block;margin:0 auto 20px;width:46px;height:46px;border-width:5px}.save-dialog strong{display:block;font-size:19px;margin-bottom:10px}.save-dialog p{color:var(--text-dim);margin:0}.mini-btn:disabled{opacity:.5;cursor:wait}
.search-result .qty-highlight{font-size:19px;font-weight:800;color:#fff;letter-spacing:.2px}.search-result .search-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:7px;color:var(--text-dim);font-size:13px}.history-view-banner{padding:14px 17px;margin:14px 0;background:var(--panel-2);border:1px solid var(--brand-light);border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.history-view-banner strong{color:var(--brand-light)}
</style>
</head>
<body>

<div class="main-header">
    <h1>LOGISTIKA: POPIS</h1>
    <p>Unos i praćenje popisa sa automatskim osvežavanjem</p>
</div>

<div class="container">
    <div class="controls">
        <div class="form-group">
            <label for="filter_osoba">Izaberite dobavljača / sheet:</label>
            <select id="filter_osoba" onchange="promenaDobavljaca()">
                <option value="Plastic_Omnium">Plastic Omnium</option>
                <option value="AD_Plastik">AD Plastik</option>
                <option value="SIGIT">SIGIT</option>
                <option value="Leva">Leva</option>
                <option value="Algontec">Algontec</option>
                <option value="FEKA">FEKA</option>
                <option value="LEVA IT">LEVA IT</option>
                <option value="PMC">PMC</option>
                <option value="SEW">SEW</option>
                <option value="Optimas">Optimas</option>
                <option value="A Raymond Italiana">A Raymond Italiana</option>
                <option value="A Raymond France">A Raymond France</option>
                <option value="Becchis Osiride">Becchis Osiride</option>
                <option value="ITW Slovakia">ITW Slovakia</option>
                <option value="ITW de France">ITW de France</option>
                <option value="ITW Lys Fusion">ITW Lys Fusion</option>
                <option value="ITW Espana">ITW Espana</option>
                <option value="Mustad">Mustad</option>
                <option value="ITW Pronovia">ITW Pronovia</option>
                <option value="Simoldes">Simoldes</option>
                <option value="BOELHOFF SRL">BOELHOFF SRL</option>
                <option value="Valeo">Valeo</option>
                <option value="Stanely Tucker">Stanely Tucker</option>
                <option value="VGV">VGV</option>
                <option value="Adhex">Adhex</option>
                <option value="Boje">Boje</option>
                <option value="Dourdin">Dourdin</option>
                <option value="Leoni">Leoni</option>
                <option value="Lisi">Lisi</option>
                <option value="Nedschroef">Nedschroef</option>
            </select>
        </div>
        <div class="form-group" style="min-width:260px;">
            <label for="global_part_search">Pretraga Part Number (svi dobavljači):</label>
            <input type="text" id="global_part_search" placeholder="Unesite ceo ili deo PN..." autocomplete="off" oninput="pretraziGlobalno()">
        </div>
        <div class="form-group" style="flex: 0.6; min-width: 180px;">
            <label for="datum_popisa">Datum Popisa: *</label>
            <input type="date" id="datum_popisa" required>
        </div>
        <div class="form-group" style="flex: 0.5; min-width: 140px;">
            <label for="vreme_popisa">Vreme Popisa: *</label>
            <input type="time" id="vreme_popisa" required>
        </div>
        <div>
            <button class="btn-refresh-modern" id="btnRefresh" onclick="ucitajPodatke()" title="Osveži podatke">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.65-5.65"></path>
                </svg>
                Osveži
            </button>
        </div>
        <div>
            <span id="loading"><span class="rotator"></span><span id="loading-text">Učitavanje...</span></span>
        </div>
    </div>

    <div id="global_search_results" class="search-results" aria-live="polite"></div>
    <div id="history_view_banner" class="history-view-banner" style="display:none"></div>
    <div style="overflow-x: auto;">
        <table id="popis-tabela">
            <thead>
                <tr>
                    <th style="width: 45%;">Component Name</th>
                    <th style="width: 25%;">Supplier</th>
                    <th style="width: 15%;">Part number</th>
                    <th class="th-qty" style="width: 15%;">QTY</th>
                </tr>
            </thead>
            <tbody id="tabela-sadrzaj">
                <tr><td colspan="4" class="center">Izaberite dobavljača za učitavanje...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="btn-container">
        <button class="action-btn btn-reset" onclick="resetujKolicine()">Resetuj količine</button>
        <button class="action-btn btn-excel" onclick="izveziUExcel()">Izvezi u Excel</button>
        <button class="action-btn btn-sync" onclick="sacuvajUGoggleSheet()">Sačuvaj u Google Sheets</button>
    </div>
    <div class="history-panel">
        <label>Istorija sačuvanih popisa — poslednjih 10 dana</label>
        <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:end;">
            <div class="form-group"><label for="history_supplier">Dobavljač</label><select id="history_supplier"><option value="">Svi dobavljači</option></select></div>
            <button class="btn-refresh-modern" onclick="ucitajIstoriju()">Prikaži istoriju</button>
        </div>
        <div id="history_status" style="margin-top:10px;color:var(--text-dim);font-size:13px;"></div>
        <div id="history_content" style="overflow-x:auto;"></div>
    </div>
</div>

<div id="save_overlay" class="save-overlay" role="status" aria-live="polite" aria-label="Čuvanje u toku"><div class="save-dialog"><span class="rotator" aria-hidden="true"></span><strong>Čuvanje u Google Sheets...</strong><p>Molimo sačekajte završetak čuvanja popisa.</p></div></div>
<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby7AJvdcxsBsoEGvslb3b76Pu88YBZXi4QN70bvrboyoGhEvKhrlGUJaMycabbXH1R4TQ/exec";

    function postaviLoading(aktivno, tekst) {
        let loading = document.getElementById('loading');
        let btn = document.getElementById('btnRefresh');
        if (tekst) document.getElementById('loading-text').innerText = tekst;
        loading.style.display = aktivno ? "inline-flex" : "none";
        btn.classList.toggle('loading', aktivno);
    }

    // Datum i vreme popisa čuvaju se u Google Sheets-u, posebno za svakog dobavljača (sheet)
    function osveziOznakeDatumVreme() {
        let datum = document.getElementById('datum_popisa');
        let vreme = document.getElementById('vreme_popisa');
        datum.classList.toggle('nedostaje', !datum.value);
        vreme.classList.toggle('nedostaje', !vreme.value);
    }

    function ocistiDatumVreme() {
        document.getElementById('datum_popisa').value = "";
        document.getElementById('vreme_popisa').value = "";
        osveziOznakeDatumVreme();
    }

    // Šalje datum i vreme popisa u Google Sheets (čim korisnik upiše/promeni vrednost)
    async function sacuvajDatumVreme() {
        osveziOznakeDatumVreme();
        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "set_meta",
                    sheet: document.getElementById('filter_osoba').value,
                    datum_popisa: document.getElementById('datum_popisa').value,
                    vreme_popisa: document.getElementById('vreme_popisa').value
                })
            });
        } catch (e) {
            console.error("Greška pri čuvanju datuma i vremena:", e);
        }
    }

    // Učitava datum i vreme popisa iz Google Sheets-a za izabranog dobavljača
    async function ucitajDatumVreme(sheetName) {
        try {
            let response = await fetch(`${WEB_APP_URL}?sheet=${encodeURIComponent(sheetName)}&meta=1`);
            let meta = await response.json();
            // Ignoriši odgovor ako je u međuvremenu izabran drugi dobavljač
            if (sheetName !== document.getElementById('filter_osoba').value) return;
            if (meta && !meta.error) {
                if (meta.datum_popisa) document.getElementById('datum_popisa').value = meta.datum_popisa;
                if (meta.vreme_popisa) document.getElementById('vreme_popisa').value = meta.vreme_popisa;
            }
        } catch (e) {
            console.error("Greška pri učitavanju datuma i vremena:", e);
        }
        osveziOznakeDatumVreme();
    }

    // Pri promeni dobavljača prikazuje se datum i vreme upisani za tog dobavljača (ili prazno ako još nisu upisani)
    function promenaDobavljaca() {
        ocistiDatumVreme();
        document.getElementById('datum_popisa').focus();
        ucitajPodatke();
    }

    // Provera da su datum i vreme popisa upisani
    function proveriDatumVreme() {
        let datum = document.getElementById('datum_popisa');
        let vreme = document.getElementById('vreme_popisa');
        datum.classList.toggle('nedostaje', !datum.value);
        vreme.classList.toggle('nedostaje', !vreme.value);

        if (!datum.value) {
            alert("Morate upisati datum popisa.");
            datum.focus();
            return false;
        }
        if (!vreme.value) {
            alert("Morate upisati vreme popisa.");
            vreme.focus();
            return false;
        }
        return true;
    }

    let viewingHistory = false;
    let loadSerial = 0;
    function toggleHistoryView(active) {
        viewingHistory = active;
        document.querySelectorAll('.btn-sync,.btn-reset').forEach(b => {b.disabled=active;b.style.opacity=active?'.45':'';});
        if (!active) document.getElementById('history_view_banner').style.display='none';
    }
    function showHistoryInMainTable(entry) {
        ++loadSerial;
        toggleHistoryView(true);
        const banner=document.getElementById('history_view_banner');
        banner.style.display='flex';
        banner.innerHTML=`<div><strong>ISTORIJA POPISA — SAMO PREGLED</strong><div>${escapeHtml(entry.sheet)} · ${escapeHtml(formatHistoryDate(entry.datum))} · ${escapeHtml(formatHistoryTime(entry.vreme))} · ${entry.items.length} stavki</div></div><button class="mini-btn" id="back_to_current">Vrati aktuelni popis</button>`;
        document.getElementById('back_to_current').onclick=()=>ucitajPodatke();
        const tbody=document.getElementById('tabela-sadrzaj');tbody.innerHTML='';
        (entry.items||[]).forEach(item=>{
            const tr=document.createElement('tr');
            [item.name,item.supplier,item.partNumber,item.qty].forEach((value,i)=>{
                const td=document.createElement('td');td.textContent=value==null?'':String(value);
                if(i===3){td.className='qty-cell';td.style.fontWeight='800';td.style.fontSize='17px';}
                tr.appendChild(td);
            });tbody.appendChild(tr);
        });
        document.getElementById('popis-tabela').scrollIntoView({behavior:'smooth',block:'start'});
    }
    async function ucitajPodatke() {
        toggleHistoryView(false);
        const currentLoad=++loadSerial;
        let sheetName = document.getElementById('filter_osoba').value;
        let tbody = document.getElementById('tabela-sadrzaj');
        
        postaviLoading(true, "Učitavanje...");
        tbody.innerHTML = `<tr><td colspan="4" class="center loading-cell"><span class="rotator rotator-big"></span>Učitavanje podataka sa Google Sheets-a...</td></tr>`;

        ucitajDatumVreme(sheetName);

        try {
            let response = await fetch(`${WEB_APP_URL}?sheet=${encodeURIComponent(sheetName)}`);
            let data = await response.json();
            
            if (currentLoad !== loadSerial || sheetName !== document.getElementById('filter_osoba').value) return;
            if (data.error) {
                tbody.innerHTML = `<tr><td colspan="4" class="center" style="color:#f08890;">Greška: ${data.error}</td></tr>`;
                return;
            }

            prikaziTabelu(data);
        } catch (error) {
            console.error("Greška pri učitavanju:", error);
            if(currentLoad !== loadSerial) return;
            tbody.innerHTML = `<tr><td colspan="4" class="center" style="color:#f08890;">Greška pri povezivanju sa Google Sheets! Proverite URL.</td></tr>`;
        } finally {
            postaviLoading(false);
        }
    }

    function prikaziTabelu(podaci) {
        const tbody = document.getElementById('tabela-sadrzaj');
        tbody.innerHTML = "";

        if (!podaci || podaci.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="center">Nema podataka u ovom sheet-u.</td></tr>`;
            return;
        }

        podaci.forEach((item) => {
            let row = document.createElement('tr');
            row.innerHTML = `
                <td><b>${item.name}</b></td>
                <td>${item.supplier}</td>
                <td class="center">${item.partNumber}</td>
                <td class="qty-cell"><input type="number" class="qty-input" data-part="${item.partNumber}" value="${item.qty !== undefined && item.qty !== null ? item.qty : ""}" min="0" placeholder="0"></td>
            `;
            tbody.appendChild(row);
        });
    }

    let saveInProgress = false;
    function setSaving(active) {
        saveInProgress = active;
        document.getElementById('save_overlay').classList.toggle('active',active);
        document.querySelectorAll('.btn-sync').forEach(b=>{b.disabled=active;b.style.opacity=active?'.55':'';});
    }
    async function sacuvajUGoggleSheet() {
        if(saveInProgress) return;
        if(viewingHistory){alert("Istorijski popis je samo za pregled. Kliknite Vrati aktuelni popis.");return;}
        if (!proveriDatumVreme()) return;

        if (!confirm("Da li ste sigurni da želite da sačuvate promene u Google Sheets bazu?")) {
            return;
        }

        let sheetName = document.getElementById('filter_osoba').value;
        let datumPopisa = document.getElementById('datum_popisa').value;
        let vremePopisa = document.getElementById('vreme_popisa').value;
        let inputs = document.querySelectorAll('.qty-input');
        let updates = {};

        inputs.forEach(input => {
            let partNum = String(input.getAttribute('data-part')).trim();
            let val = input.value;
            updates[partNum] = val !== "" ? Number(val) : "";
        });

        setSaving(true);

        try {
            let response = await fetch(WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ sheet: sheetName, datum_popisa: datumPopisa, vreme_popisa: vremePopisa, updates: updates })
            });
            let result = await response.json();
            
            if (result.status === "success") {
                setSaving(false);
                alert("Uspešno sačuvano u Google Sheets bazu!");
                ucitajPodatke();
                ucitajIstoriju();
            } else {
                setSaving(false);
                alert("Došlo je do greške: " + (result.message || "Nepoznata greška"));
            }
        } catch (error) {
            console.error("Greška:", error);
            setSaving(false);
            alert("Greška u mreži prilikom čuvanja.");
        } finally {
            setSaving(false);
        }
    }

    function resetujKolicine() {
        if(viewingHistory) return;
        if (!confirm("Da li ste sigurni da želite da resetujete sve količine na 0?")) return;
        document.querySelectorAll('.qty-input').forEach(input => input.value = "0");

        // Datum i vreme popisa brišu se tek pri resetovanju količina (samo za izabranog dobavljača, i u Google Sheets-u)
        ocistiDatumVreme();
        sacuvajDatumVreme();
    }

    function izveziUExcel() {
        if (!proveriDatumVreme()) return;
        if (!confirm("Da li ste sigurni da želite da izvezete podatke u Excel?")) return;

        let datumPopisa = document.getElementById('datum_popisa').value;
        let vremePopisa = document.getElementById('vreme_popisa').value;
        let izabrano = document.getElementById('filter_osoba').value;
        let rows = document.querySelectorAll('#tabela-sadrzaj tr');
        
        let excelData = [
            ["DATUM POPISA:", datumPopisa],
            ["VREME POPISA:", vremePopisa],
            ["DOBAVLJAČ / SHEET:", izabrano],
            [],
            ["Component Name", "Supplier", "Part number", "QTY"]
        ];

        rows.forEach(row => {
            let cols = row.querySelectorAll('td');
            if(cols.length === 4) {
                let name = cols[0].innerText;
                let supplier = cols[1].innerText;
                let partNumber = cols[2].innerText;
                let qty = cols[3].querySelector('input') ? cols[3].querySelector('input').value : "";
                excelData.push([name, supplier, partNumber, qty]);
            }
        });

        let ws = XLSX.utils.aoa_to_sheet(excelData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Popis");
        XLSX.writeFile(wb, `Popis_${izabrano}_${datumPopisa}.xlsx`);
    }

    document.getElementById('datum_popisa').addEventListener('input', osveziOznakeDatumVreme);
    document.getElementById('vreme_popisa').addEventListener('input', osveziOznakeDatumVreme);
    document.getElementById('datum_popisa').addEventListener('change', sacuvajDatumVreme);
    document.getElementById('vreme_popisa').addEventListener('change', sacuvajDatumVreme);

    // Globalna pretraga na serveru; ne menja trenutno izabranog dobavljača.
    let searchTimer = null, searchSerial = 0;
    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function pretraziGlobalno() {
        clearTimeout(searchTimer);
        const q = document.getElementById('global_part_search').value.trim();
        const panel = document.getElementById('global_search_results');
        const serial = ++searchSerial;
        if (!q) { panel.style.display = 'none'; panel.innerHTML = ''; return; }
        panel.style.display = 'block';
        panel.innerHTML = '<div class="search-loading" role="status"><span class="rotator" aria-hidden="true"></span><div>Pretraga svih dobavljača...<small>Tražim Part Number u Google Sheets bazi</small></div></div>';
        searchTimer = setTimeout(async () => {
            try {
                const r = await fetch(`${WEB_APP_URL}?action=search&pn=${encodeURIComponent(q)}`);
                const data = await r.json();
                if (serial !== searchSerial) return;
                if (data.error) throw new Error(data.error);
                if (!data.length) { panel.textContent = 'Nema pronađenih Part Number-a.'; return; }
                panel.innerHTML = `<div style="margin-bottom:8px;color:var(--text-dim)">Pronađeno: ${data.length}${data.length===100?' (prvih 100)':''}</div>` + data.map(item =>
                    `<div class="search-result"><div><b>${escapeHtml(item.partNumber)}</b> — ${escapeHtml(item.name)}<div class="search-meta"><span>${escapeHtml(item.supplier)}</span><span>QTY: <strong class="qty-highlight">${escapeHtml(item.qty)}</strong></span><span>Datum popisa: <b>${escapeHtml(formatHistoryDate(item.datum_popisa))}</b></span></div></div><button class="mini-btn" data-sheet="${escapeHtml(item.sheet)}" data-part="${escapeHtml(item.partNumber)}">Otvori popis</button></div>`).join('');
                panel.querySelectorAll('button[data-sheet]').forEach(btn => btn.addEventListener('click', async () => {
                    const select = document.getElementById('filter_osoba');
                    select.value = btn.dataset.sheet;
                    if (select.value !== btn.dataset.sheet) { alert('Dobavljač nije na listi: ' + btn.dataset.sheet); return; }
                    document.getElementById('global_part_search').value = '';
                    panel.style.display = 'none'; ++searchSerial;
                    await promenaDobavljaca();
                    const target = [...document.querySelectorAll('.qty-input')].find(x => x.dataset.part === btn.dataset.part);
                    if (target) { target.scrollIntoView({behavior:'smooth',block:'center'}); target.focus(); }
                }));
            } catch(e) { if(serial===searchSerial) panel.textContent = 'Greška pri pretrazi: ' + e.message; }
        }, 180);
    }
    function formatHistoryDate(raw) {
        if(raw===null || raw===undefined || raw==='') return '—';
        const str=String(raw).trim();
        let m=str.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m) return `${m[2]}/${m[3]}/${m[1]}`;
        m=str.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
        if(m) return `${m[2].padStart(2,'0')}/${m[1].padStart(2,'0')}/${m[3]}`;
        const d=new Date(str);
        if(!isNaN(d.getTime())) return new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Belgrade',month:'2-digit',day:'2-digit',year:'numeric'}).format(d);
        return str;
    }
    function formatHistoryTime(raw) {
        if(raw===null || raw===undefined || raw==='') return '—';
        const str=String(raw).trim();
        const m=str.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?$/i);
        if(m) {
            let h=Number(m[1]);const ampm=m[3]?m[3].toUpperCase():(h>=12?'PM':'AM');
            if(m[3]) h=h%12||12; else h=h%12||12;
            return `${String(h).padStart(2,'0')}:${m[2]} ${ampm}`;
        }
        const d=new Date(str);
        if(!isNaN(d.getTime())) return new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Belgrade',hour:'2-digit',minute:'2-digit',hour12:true}).format(d);
        return str;
    }
    function exportHistoryExcel(entry) {
        if(typeof XLSX==='undefined') {alert('Excel biblioteka nije dostupna.');return;}
        const rows=[['DATUM POPISA:',formatHistoryDate(entry.datum)],['VREME POPISA:',formatHistoryTime(entry.vreme)],['DOBAVLJAČ / SHEET:',entry.sheet],[],['Component Name','Supplier','Part number','QTY']];
        (entry.items||[]).forEach(x=>rows.push([x.name,x.supplier,String(x.partNumber),x.qty]));
        const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:45},{wch:28},{wch:23},{wch:12}];
        const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Popis');
        const safe=String(entry.sheet).replace(/[\\/:*?"<>|]/g,'_');
        XLSX.writeFile(wb,`Popis_${safe}_${formatHistoryDate(entry.datum).replaceAll('/','-')}.xlsx`);
    }
    async function ucitajIstoriju() {
        const status=document.getElementById('history_status');
        const content=document.getElementById('history_content');
        const supplier=document.getElementById('history_supplier').value;
        status.innerHTML='<span class="rotator" style="vertical-align:middle;margin-right:8px"></span>Učitavanje istorije...';content.innerHTML='';
        try {
            const r=await fetch(`${WEB_APP_URL}?action=history&sheet=${encodeURIComponent(supplier)}`);
            if(!r.ok) throw new Error('HTTP '+r.status);
            const data=await r.json();if(data.error) throw new Error(data.error);
            status.textContent=data.length?`Sačuvani popisi: ${data.length}`:'Nema sačuvanih popisa u poslednjih 10 dana.';
            if(!data.length)return;
            content.innerHTML='<table><thead><tr><th>Datum (MM/DD/YYYY)</th><th>Vreme (AM/PM)</th><th>Dobavljač</th><th>Stavki</th><th>Akcije</th></tr></thead><tbody>'+
                data.map((x,i)=>`<tr><td>${escapeHtml(formatHistoryDate(x.datum))}</td><td>${escapeHtml(formatHistoryTime(x.vreme))}</td><td>${escapeHtml(x.sheet)}</td><td>${escapeHtml(x.count)}</td><td><button class="mini-btn" data-history-index="${i}">Prikaži</button> <button class="mini-btn" data-export-index="${i}">Skini Excel</button></td></tr>`).join('')+'</tbody></table><div id="history_details"></div>';
            content.querySelectorAll('button[data-history-index]').forEach(b=>b.addEventListener('click',()=>{
                const x=data[Number(b.dataset.historyIndex)];
                showHistoryInMainTable(x);
            }));
            content.querySelectorAll('button[data-export-index]').forEach(b=>b.addEventListener('click',()=>exportHistoryExcel(data[Number(b.dataset.exportIndex)])));
        }catch(e){status.textContent='Greška pri učitavanju istorije: '+e.message;}
    }
    function initHistorySuppliers() {
        const source=document.getElementById('filter_osoba');
        const target=document.getElementById('history_supplier');
        [...source.options].forEach(opt=>target.add(new Option(opt.text,opt.value)));
    }

    window.onload = function() {
        // Datum i vreme se ne popunjavaju automatski - korisnik ih mora upisati (osim ako su već upisani za tog dobavljača u Google Sheets-u)
        osveziOznakeDatumVreme();
        initHistorySuppliers();
        ucitajPodatke();
        ucitajIstoriju();
    };
</script>
