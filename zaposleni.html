<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellantis | Zaposleni</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #111111; }
        .header-clean { background-color: #ffffff; padding: 25px 0; border-bottom: 1px solid #eaeaea; }
        .brand-logo { font-weight: 700; font-size: 26px; letter-spacing: 7px; color: #1a3263; text-transform: uppercase; text-align: center; }
        
        .clean-card { background: #ffffff; border: 1px solid #eaeaea; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .btn-stellantis { background: #1a3263; color: #fff; font-weight: 600; }
        
        .org-node { 
            padding: 10px; border: 1px solid #ddd; margin: 5px; border-radius: 8px; background: #fff; 
            display: flex; align-items: center; justify-content: space-between; 
        }
        .level-supervisor { border-left: 5px solid #1a3263; font-weight: bold; text-align: center; margin-bottom: 20px; justify-content: center; }
        
        .tl-group { 
            display: flex; 
            justify-content: flex-start; 
            flex-wrap: nowrap; 
            overflow-x: auto; 
            padding-bottom: 15px;
        }
        .col { 
            flex: 0 0 auto; 
            width: 220px; 
        }
        
        .level-tl { border-left: 5px solid #ffc107; min-width: 200px; }
        .level-worker { border-left: 3px dashed #666; font-size: 0.85em; margin: 3px 0; }
        .action-btns { margin-left: 10px; }
    </style>
</head>
<body>

<header class="header-clean">
    <div class="brand-logo">Stellantis - Zaposleni</div>
</header>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-4" id="adminPanelZaposleni">
            <div class="clean-card">
                <h5>Dodaj zaposlenog</h5>
                <form id="empForm">
                    <div class="form-group"><input type="text" id="ime" class="form-control" placeholder="Ime" required></div>
                    <div class="form-group"><input type="text" id="prezime" class="form-control" placeholder="Prezime" required></div>
                    <div class="form-group">
                        <select id="pozicija" class="form-control" onchange="checkPosition()">
                            <option value="Supervisor">Supervisor</option>
                            <option value="Team Leader">Team Leader</option>
                            <option value="Viljuskarista">Viljuškarista</option>
                        </select>
                    </div>
                    <div class="form-group" id="tlContainer" style="display:none;">
                        <select id="tlPripadnost" class="form-control"></select>
                    </div>
                    <div class="form-group">
                        <select id="nadredjeni" class="form-control">
                            <option value="Dusan Kostic">Dušan Kostić</option>
                            <option value="Goran Simovic">Goran Simović</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-stellantis btn-block">Dodaj radnika</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="clean-card" id="orgChart"></div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQHnN8BK51uFhL3EbYi6k6E3Bb-c9uq3M9n_LUX5UtKWYBzDQ5FlfPIxRn6e5AKtZO/exec";
    let zaposleni = [];
    
    // Provera role iz localStorage
    const userRole = localStorage.getItem('userRole');

    function proveriPristupZaAdminPanel() {
        if (userRole !== 'MASTER' && userRole !== 'ADMIN') {
            const adminPanel = document.getElementById('adminPanelZaposleni');
            if (adminPanel) adminPanel.style.display = "none";
        }
    }

    fetch(GOOGLE_SCRIPT_URL).then(r => r.json()).then(data => { 
        zaposleni = data; 
        render(); 
        proveriPristupZaAdminPanel(); // Poziv nakon učitavanja podataka
    });

    function checkPosition() {
        const poz = document.getElementById('pozicija').value;
        const container = document.getElementById('tlContainer');
        const select = document.getElementById('tlPripadnost');
        
        container.style.display = (poz === 'Viljuskarista') ? 'block' : 'none';
        if(poz === 'Viljuskarista') {
            select.innerHTML = zaposleni.filter(x => x.pozicija === 'Team Leader')
                .map(x => `<option value="${x.id}">${x.ime} ${x.prezime}</option>`).join('');
        }
    }

    async function posalji(data) {
        await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
        location.reload();
    }

    document.getElementById('empForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const obj = {
            action: 'add',
            id: Date.now(),
            ime: document.getElementById('ime').value,
            prezime: document.getElementById('prezime').value,
            pozicija: document.getElementById('pozicija').value,
            nadredjeni: document.getElementById('nadredjeni').value,
            tl: document.getElementById('tlPripadnost').value || ""
        };
        posalji(obj);
    });

    function del(id) {
        if(confirm('Da li ste sigurni da želite da obrišete radnika?')) {
            posalji({action: 'delete', id: id});
        }
    }

    function render() {
        const chart = document.getElementById('orgChart');
        chart.innerHTML = '<h5>Organizacioni grafikon</h5>';
        
        // Prikazuje dugme za brisanje samo za MASTER/ADMIN
        const showDelete = (userRole === 'MASTER' || userRole === 'ADMIN');
        
        ['Dusan Kostic', 'Goran Simovic'].forEach(sup => {
            chart.innerHTML += `<div class="org-node level-supervisor">${sup}</div>`;
            chart.innerHTML += `<div class="tl-group" id="group-${sup.replace(/\s/g, '')}"></div>`;
            const group = document.getElementById(`group-${sup.replace(/\s/g, '')}`);
            
            zaposleni.filter(x => x.nadredjeni === sup && x.pozicija === 'Team Leader').forEach(tl => {
                const deleteBtn = showDelete ? `<button class="btn btn-sm btn-danger btn-obrisi" onclick="del(${tl.id})">X</button>` : '';
                group.innerHTML += `
                    <div class="col">
                        <div class="org-node level-tl">
                            ${tl.ime} ${tl.prezime} 
                            <span class="action-btns">${deleteBtn}</span>
                        </div>
                        <div id="workers-${tl.id}"></div>
                    </div>`;
                
                zaposleni.filter(v => v.tl == tl.id).forEach(v => {
                    const deleteBtnV = showDelete ? `<button class="btn btn-sm btn-link btn-obrisi" onclick="del(${v.id})">x</button>` : '';
                    document.getElementById(`workers-${tl.id}`).innerHTML += `
                        <div class="org-node level-worker">
                            ${v.ime} ${v.prezime} 
                            ${deleteBtnV}
                        </div>`;
                });
            });
        });
    }
</script>
</body>
</html>
